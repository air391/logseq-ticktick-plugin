name: Dida API Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - ci/dida-api-smoke
    paths:
      - .github/workflows/dida-api-smoke.yml
      - src/ticktick/**
      - src/task-state.ts

permissions:
  contents: read

jobs:
  dida-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIDA_ACCESS_TOKEN: ${{ secrets.DIDA_ACCESS_TOKEN }}

    steps:
      - name: Verify secret is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DIDA_ACCESS_TOKEN:-}" ]]; then
            echo "DIDA_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install official Dida CLI
        run: npm install --global @suibiji/dida-cli

      - name: Authenticate with Dida
        shell: bash
        run: |
          set -euo pipefail
          dida auth token "$DIDA_ACCESS_TOKEN"
          dida auth status

      - name: Verify project data endpoint used by picker and inbox
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.dida365.com/open/v1"
          PROJECTS_FILE="$(mktemp)"
          curl -fsS "$API_BASE/project" \
            -H "Authorization: Bearer $DIDA_ACCESS_TOKEN" > "$PROJECTS_FILE"

          PROJECT_ID="$(jq -r '.[0].id // empty' "$PROJECTS_FILE")"
          if [[ -z "$PROJECT_ID" ]]; then
            echo "No Dida project is available for project-data smoke testing."
            exit 1
          fi

          DATA_FILE="$(mktemp)"
          curl -fsS "$API_BASE/project/$PROJECT_ID/data" \
            -H "Authorization: Bearer $DIDA_ACCESS_TOKEN" > "$DATA_FILE"

          jq -e '.project.id and (.tasks | type == "array")' "$DATA_FILE" >/dev/null
          echo "Project data endpoint returned project metadata and a task array."

      - name: Run real Dida CRUD smoke test
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ID=""
          TASK_ID=""

          cleanup() {
            if [[ -n "$PROJECT_ID" && -n "$TASK_ID" ]]; then
              echo "Cleaning up CI task..."
              dida task delete "$PROJECT_ID" "$TASK_ID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          echo "Listing projects..."
          PROJECTS_JSON="$(dida project list --json)"
          PROJECT_ID="$(printf '%s' "$PROJECTS_JSON" | jq -r 'if type == "array" then .[0].id else (.projects // .data // [])[0].id end // empty')"

          if [[ -z "$PROJECT_ID" || "$PROJECT_ID" == "null" ]]; then
            echo "Could not find a project in Dida."
            printf '%s\n' "$PROJECTS_JSON" | jq . || true
            exit 1
          fi

          TITLE="[logseq-dida-ci] ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          UPDATED_TITLE="${TITLE} updated"

          echo "Creating task in project ${PROJECT_ID}..."
          CREATED_JSON="$(dida task create --title "$TITLE" --project "$PROJECT_ID" --json)"
          TASK_ID="$(printf '%s' "$CREATED_JSON" | jq -r '.id // .task.id // .data.id // empty')"

          if [[ -z "$TASK_ID" || "$TASK_ID" == "null" ]]; then
            echo "Task creation returned no task id."
            printf '%s\n' "$CREATED_JSON" | jq . || true
            exit 1
          fi

          echo "Reading created task..."
          GET_JSON="$(dida task get "$PROJECT_ID" "$TASK_ID" --json)"
          ACTUAL_TITLE="$(printf '%s' "$GET_JSON" | jq -r '.title // .task.title // .data.title // empty')"
          [[ "$ACTUAL_TITLE" == "$TITLE" ]]

          echo "Updating task..."
          dida task update "$TASK_ID" --id "$TASK_ID" --project "$PROJECT_ID" --title "$UPDATED_TITLE" --json >/tmp/dida-update.json

          echo "Verifying update..."
          GET_UPDATED_JSON="$(dida task get "$PROJECT_ID" "$TASK_ID" --json)"
          ACTUAL_UPDATED_TITLE="$(printf '%s' "$GET_UPDATED_JSON" | jq -r '.title // .task.title // .data.title // empty')"
          [[ "$ACTUAL_UPDATED_TITLE" == "$UPDATED_TITLE" ]]

          echo "Completing task..."
          dida task complete "$PROJECT_ID" "$TASK_ID"

          echo "Deleting test task..."
          dida task delete "$PROJECT_ID" "$TASK_ID"
          TASK_ID=""

          echo "Dida real API CRUD smoke test passed."

      - name: Verify date update and reopen semantics
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.dida365.com/open/v1"
          PROJECT_ID="$(curl -fsS "$API_BASE/project" -H "Authorization: Bearer $DIDA_ACCESS_TOKEN" | jq -r '.[0].id // empty')"
          [[ -n "$PROJECT_ID" ]]

          TITLE="[logseq-date-ci] ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CREATE_FILE="$(mktemp)"
          curl -fsS -X POST "$API_BASE/task" \
            -H "Authorization: Bearer $DIDA_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg title "$TITLE" --arg projectId "$PROJECT_ID" '{title:$title,projectId:$projectId}')" > "$CREATE_FILE"

          TASK_ID="$(jq -r '.id // empty' "$CREATE_FILE")"
          cleanup() {
            if [[ -n "${TASK_ID:-}" ]]; then
              curl -fsS -X DELETE "$API_BASE/project/$PROJECT_ID/task/$TASK_ID" \
                -H "Authorization: Bearer $DIDA_ACCESS_TOKEN" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          START_DATE="2026-09-09T06:00:00.000Z"
          DUE_DATE="2026-09-10T08:30:00.000Z"
          curl -fsS -X POST "$API_BASE/task/$TASK_ID" \
            -H "Authorization: Bearer $DIDA_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg id "$TASK_ID" --arg projectId "$PROJECT_ID" --arg title "$TITLE" --arg startDate "$START_DATE" --arg dueDate "$DUE_DATE" '{id:$id,projectId:$projectId,title:$title,startDate:$startDate,dueDate:$dueDate,status:0}')" >/dev/null

          DATE_GET="$(curl -fsS "$API_BASE/project/$PROJECT_ID/task/$TASK_ID" -H "Authorization: Bearer $DIDA_ACCESS_TOKEN")"
          jq -e --arg startDate "$START_DATE" --arg dueDate "$DUE_DATE" '(.startDate != null) and (.dueDate != null)' <<<"$DATE_GET" >/dev/null

          curl -fsS -X POST "$API_BASE/project/$PROJECT_ID/task/$TASK_ID/complete" \
            -H "Authorization: Bearer $DIDA_ACCESS_TOKEN" >/dev/null

          curl -fsS -X POST "$API_BASE/task/$TASK_ID" \
            -H "Authorization: Bearer $DIDA_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg id "$TASK_ID" --arg projectId "$PROJECT_ID" --arg title "$TITLE" '{id:$id,projectId:$projectId,title:$title,status:0}')" >/dev/null

          REOPEN_GET="$(curl -fsS "$API_BASE/project/$PROJECT_ID/task/$TASK_ID" -H "Authorization: Bearer $DIDA_ACCESS_TOKEN")"
          STATUS="$(jq -r '.status // empty' <<<"$REOPEN_GET")"
          COMPLETED_TIME="$(jq -r '.completedTime // empty' <<<"$REOPEN_GET")"
          [[ "$STATUS" == "0" ]]
          [[ -z "$COMPLETED_TIME" || "$COMPLETED_TIME" == "null" ]]
          echo "Date update and reopen semantics passed."

      - name: Verify plugin-shaped create request without projectId
        shell: bash
        run: |
          set -euo pipefail

          API_BASE="https://api.dida365.com/open/v1"
          TITLE="[logseq-plugin-shape-ci] ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RESPONSE_FILE="$(mktemp)"
          STATUS="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
            -X POST "$API_BASE/task" \
            -H "Authorization: Bearer $DIDA_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg title "$TITLE" '{title:$title,priority:0,items:[]}')")"

          echo "HTTP status: $STATUS"
          cat "$RESPONSE_FILE" | jq . || cat "$RESPONSE_FILE"

          if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
            echo "Plugin-shaped create request without projectId is not supported by Dida."
            exit 1
          fi

          TASK_ID="$(jq -r '.id // empty' "$RESPONSE_FILE")"
          PROJECT_ID="$(jq -r '.projectId // empty' "$RESPONSE_FILE")"

          if [[ -z "$TASK_ID" || -z "$PROJECT_ID" ]]; then
            echo "Create succeeded but task/project id was missing."
            exit 1
          fi

          curl -fsS -X DELETE \
            "$API_BASE/project/$PROJECT_ID/task/$TASK_ID" \
            -H "Authorization: Bearer $DIDA_ACCESS_TOKEN" >/dev/null

          echo "Plugin-shaped create request is supported and cleaned up."
